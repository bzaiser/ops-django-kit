[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-django-kit"
version = "1.0.0"
description = "Reusable Django healthcheck (/healthz), audit log UI, and backup command for Docker/NAS apps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[tool.setuptools.packages.find]
include = ["ops_kit*"]

[tool.setuptools.package-data]
ops_kit = [
    "templates/**/*",
]
